name: CI

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  # ===============================================
  # Lines of Code Cap Check
  # ===============================================
  loc-cap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-loc-cap.sh

  # ===============================================
  # API (NestJS) Tests
  # ===============================================
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          KEYCLOAK_ISSUER_URL: https://id.besbpo.co.za/realms/besbpo
          KEYCLOAK_JWKS_URI: https://id.besbpo.co.za/realms/besbpo/protocol/openid-connect/certs
          KEYCLOAK_AUDIENCE: bellwetherswe-api
          PUBLIC_WEB_URL: http://localhost:3000
          PUBLIC_API_URL: http://localhost:3001
          AI_SERVICE_URL: http://localhost:8000
          NOTIFICATION_CHANNEL: log

  # ===============================================
  # Web (Next.js) Tests
  # ===============================================
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          AUTH_SECRET: test-secret-for-ci
          AUTH_KEYCLOAK_ISSUER: https://id.besbpo.co.za/realms/besbpo

  # ===============================================
  # AI Service (FastAPI) Tests
  # ===============================================
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest --cov=app --cov-report=xml

  # ===============================================
  # Docker Build Check
  # ===============================================
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t bellwether-api:test .
      - name: Build Web image
        run: docker build -f Dockerfile.web -t bellwether-web:test .
      - name: Build AI image
        run: docker build -f Dockerfile.ai -t bellwether-ai:test .
